# /etc/nginx/sites-available/edulyfe-epta  (ganti example.com; sertifikat via: sudo certbot --nginx -d example.com)
server {
    listen 80;
    server_name english.edulyfe.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name english.edulyfe.id;
    # ssl_certificate / ssl_certificate_key diisi otomatis oleh certbot

    # Upload audio Listening maks 15 MB + overhead form
    client_max_body_size 20m;

    # Kompres teks (JSON/HTML/JS/CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # PENTING: timpa (bukan tambah) agar klien tidak bisa memalsukan IP. Dipakai rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming audio (HTTP Range) jangan di-buffer penuh
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
