# Jalankan: salin .env.example ke .env, isi nilainya, lalu `docker compose up -d --build`
# Untuk Atlas: hapus service mongo dan isi MONGODB_URI di .env.
services:
  app:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/edulyfe_epta}
      ENABLE_INPROCESS_CRON: "true" # pengingat mingguan (satu instance saja)
    ports: ["3000:3000"]
    depends_on: [mongo]
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    restart: unless-stopped
volumes:
  mongo-data:
